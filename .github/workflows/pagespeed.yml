name: Daily PageSpeed Insights check

# Runs before the solo-stack-growth-research cloud routine (06:42 UTC) so its
# TASK 3 can read fresh results from PAGESPEED-RESULTS.md instead of needing
# the API key itself. The key lives only in this repo's GitHub Actions
# secret (Settings -> Secrets and variables -> Actions -> GOOGLE_PAGESPEED_KEY),
# never in repo content or in the cloud routine's own config.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pagespeed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run PageSpeed Insights and log results
        env:
          PAGESPEED_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse, datetime

          pages = [
              "",
              "articles/best-ai-tools-for-solopreneurs-2026.html",
              "articles/systeme-io-review.html",
              "articles/jasper-ai-review.html",
              "about.html",
              "contact.html",
          ]
          day_index = datetime.date.today().toordinal() % len(pages)
          page = pages[day_index]
          url = "https://johan1974.github.io/solo-stack-blog/" + page

          key = os.environ.get("PAGESPEED_API_KEY", "")
          api_url = (
              "https://www.googleapis.com/pagespeedonline/v5/runPagespeed"
              "?url=" + urllib.parse.quote(url, safe="")
              + "&category=performance&category=seo&category=accessibility&category=best-practices"
              + "&strategy=mobile&key=" + key
          )

          today = datetime.date.today().isoformat()
          lines = [f"## {today} — {url}", ""]

          try:
              with urllib.request.urlopen(api_url, timeout=60) as resp:
                  data = json.load(resp)
              if "error" in data:
                  lines.append(f"ERROR: {data['error'].get('message', data['error'])}")
              else:
                  cats = data["lighthouseResult"]["categories"]
                  scores = ", ".join(f"{k} {round(v['score']*100)}/100" for k, v in cats.items())
                  lines.append(f"Scores: {scores}")
                  audits = data["lighthouseResult"]["audits"]
                  issues = [
                      a["title"] for a in audits.values()
                      if a.get("scoreDisplayMode") == "binary" and a.get("score") is not None and a["score"] < 1
                  ]
                  if issues:
                      lines.append("")
                      lines.append("Issues flagged:")
                      lines.extend(f"- {i}" for i in issues)
                  else:
                      lines.append("")
                      lines.append("No issues flagged.")
          except Exception as e:
              lines.append(f"ERROR: request failed ({e})")

          lines.append("")
          entry = "\n".join(lines) + "\n"

          path = "PAGESPEED-RESULTS.md"
          marker = "<!-- ENTRIES-START -->\n"
          default_file = (
              "# PageSpeed Insights — daily results\n\n"
              "Nieuwste bovenaan. Bijgehouden door .github/workflows/pagespeed.yml, "
              "gelezen door de solo-stack-growth-research routine (TASK 3).\n\n"
              + marker
          )
          existing = open(path).read() if os.path.exists(path) else default_file
          if marker not in existing:
              # Older file without the marker (predates this script version) -
              # add it right after the title+intro paragraph instead of
              # guessing with blank-line counting, which put entries in the
              # wrong place once before.
              existing = existing.rstrip("\n") + "\n\n" + marker
          insert_at = existing.index(marker) + len(marker)
          new_content = existing[:insert_at] + entry + existing[insert_at:]
          with open(path, "w") as f:
              f.write(new_content)

          print(f"Checked {url}")
          PYEOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PAGESPEED-RESULTS.md
          git diff --cached --quiet || git commit -m "Daily PageSpeed Insights check"
          git push
